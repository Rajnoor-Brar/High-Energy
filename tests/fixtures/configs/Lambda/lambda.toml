# lambda.toml — Λ → p π⁻ from Pythia (Angantyr Ne-20 on Ne-20, lambda.cmnd), through two
# analysis paths on the same events (rework v2 schema, docs/02_User_Guide.md §6.1).
#
#   hep run Lambda/lambda                   one run at 7 TeV, both paths
#   hep run Lambda/lambda masswindow        the mass window swept through both paths at once
#
# App_Pythia fans out to two FIFOs: the Rivet analysis Lamriv reads one, the module program Lambda
# (modules/Lambda/Lambda.cc) the other. Both use modules/Lambda/Reconstruction.hh, so on the same
# events they agree to floating-point precision, which checks both frameworks.
#
# Translated from the v1 file (git show rework/v1-final:configs/Lambda/lambda.toml): [beams] became
# the static beam quantities, [analyzers.module.options] the module's [config], v1's option
# quantities are targeted quantities. A module option can now be swept (masstol, costheta), which v1
# could not do (00/B40). The v1 `RESERVED = 2` (pp's 2 × Z) is kept with Ne–Ne beams, as v1 had it.

[run]
name          = "lambda"
project       = "Lambda"
configuration = "single"
event_count   = 20_000
threads       = 16

[run.cfgs.single]
description = "One run at 7 TeV, both analysis paths"
sweeps      = []
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.masswindow]
description = "Mass-window scan through both paths: four points, each its own generation (V9)"
sweeps      = ["masstol"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.costheta]
description = "Does the decay-angle cut buy anything the mass window does not?"
sweeps      = ["costheta"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.cuts_grid]
description = "Mass window x decay angle: one page per angle cut, mass-window curves on it"
sweeps      = ["masstol", "costheta"]
plot_points = ["costheta"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.sets]
description = "The three candidate sets as curves on one page (SET is a Lamriv option; the module books all three anyway)"
sweeps      = ["set"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.energy]
description = "Lambda yield against collision energy"
sweeps      = ["sqrts"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[run.cfgs.replicas]
description = "Three statistically equivalent runs at 7 TeV, for a stability check"
sweeps      = ["replica"]
tools       = [["pythia", "lamriv", "lambda"], "yd2rt"]

[prelim]
fifo = ["to_rivet.hepmc", "to_module.hepmc"]     # fan-out: one FIFO per reader (V16)

[static]
sqrts  = "7tev"
beam_a = "Ne20"
beam_b = "Ne20"

[tools.pythia]
tool        = "pythia"
baseconfig  = "lambda.cmnd"
output_file = ["to_rivet.hepmc", "to_module.hepmc"]

[tools.lamriv]
tool        = "rivet"
input       = "to_rivet.hepmc"
analyses    = ["Lamriv"]
options     = { RESERVED = 2 }     # the module's reserved_protons: the two paths' cuts must match
output_file = "lamriv.yoda"

[tools.lambda]
tool        = "module"
executable  = "Lambda.exe"         # build/Lambda/Lambda.exe, from modules/Lambda/Lambda.cc
input       = "to_module.hepmc"
output_file = "lambda.root"

[tools.lambda.config]              # Lamriv's option defaults, under the module's names
mass_tolerance      = 0.15         # |m(pπ) − m(Λ)| accepted, GeV
cos_theta_tolerance = 0.0          # 0 = off; else |cos θ* + 1| tolerance
reserved_protons    = 2            # beam protons per event that cannot come from a Λ
track_pt_min        = 0.0
track_eta_max       = 8.0
bins                = 100

[tools.yd2rt]
tool        = "yd2rt"
input       = "lamriv.yoda"
output_file = "lamriv.root"

[quantities.sqrts]
values = [900.0, 7000.0, 13000.0]
tags   = ["900gev", "7tev", "13tev"]
labels = ["900 GeV", "7 TeV", "13 TeV"]

[quantities.beam_a]
values = [1000100200]
tags   = ["Ne20"]

[quantities.beam_b]
values = [1000100200]
tags   = ["Ne20"]

[quantities.masstol]               # one quantity, two consumers, a key for each
target = ["lamriv/Lamriv", "lambda"]
key    = { lamriv = "MASSTOL", lambda = "mass_tolerance" }
values = [0.05, 0.10, 0.15, 0.25]
tags   = ["m050", "m100", "m150", "m250"]
labels = ['$\pm$ 50 MeV', '$\pm$ 100 MeV', '$\pm$ 150 MeV', '$\pm$ 250 MeV']

[quantities.costheta]
target = ["lamriv/Lamriv", "lambda"]
key    = { lamriv = "COSTHETATOL", lambda = "cos_theta_tolerance" }
values = [0.0, 0.05, 0.2]
tags   = ["noct", "ct005", "ct020"]
labels = ['no cos$\theta$* cut', '|cos$\theta$* + 1| < 0.05', '|cos$\theta$* + 1| < 0.2']

[quantities.set]
target = "lamriv/Lamriv"
key    = "SET"
values = ["unvalidated", "validated", "selected"]
tags   = ["unval", "val", "sel"]
labels = ["all pairs", "in the mass window", "ranked, one-to-one"]

[quantities.replica]
target = "pythia/seed"
values = [1, 2, 3]
tags   = ["s1", "s2", "s3"]

# Pages come from the YODA product (lamriv.yoda); the module's lambda.root is for ROOT users.
[plot]
formats    = ["png"]
objects    = ["/Lamriv*"]
auto_range = true
