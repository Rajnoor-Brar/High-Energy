# mini.toml — the end-to-end config for `hep run` (rework P3-S05).
#
# Two generations of a few hundred events each: enough to exercise planning, preflight, supervision,
# the status stream, the results layout and provenance, and small enough that the test suite can run
# it. The base card is the frozen golden input, so this config drifts with nothing.
#
# Run it only with HEKIT_RESULTS pointing somewhere under output/scratch/.

schema = 2

[run]
name = "mini"
events = 300
seed = 12345
threads = 2
skip_existing = true

[generator]
tool = "pythia"
card = "../golden/inputs/PhotoProduction/photo_ep.cmnd"

[beams]
ids = [2212, -11]

[rivet]
analyses = ["photo_eic"]
# This config is not a project of its own, so it borrows PhotoProduction's built plugin.
paths = ["../../build/analyses/PhotoProduction"]

[output]
tag_style = "tag"

[settle.use]
energies = "27x920"

[quantity.energies]
type = "energies"
values = [[920, 27.5]]
labels = ["27x920 GeV"]
tags = ["27x920"]
use = 1

[quantity.pdf]
type = "setting"
key = "PDF:pSet"
values = ["LHAPDF6:MSTW2008lo68cl", "LHAPDF6:NNPDF23_lo_as_0130_qed"]
tags = ["MSTW08lo", "NNPDF23lo"]
labels = ["MSTW2008lo", "NNPDF2.3lo"]

[sweep]
across = ["pdf"]

[study.pdf]
description = "the two PDF sets, one generation each"
across = ["pdf"]
