# HERA validation: ZEUS 2012 inclusive-jet photoproduction (920x27.5 GeV e+p)
# with Rivet's built-in ZEUS_2012_I1116258 analysis and its own reference data.
#   rivpyth configs/PhotoProduction/zeus_validation.toml && ydmrg configs/PhotoProduction/zeus_validation.toml

[analysis]
cmnd_file   = "photo_ep.cmnd"
event_count = 1_000_000
seed        = 270403

[settle.rivet]
plugin = "ZEUS_2012_I1116258"

[settle.cmnd]
beams = [920, 27.5]                       # HERA; not part of the EIC beams catalogue

[settle.use]
"cmnd.lepton" = "ep"

[sweep]
across       = ["cmnd.pdf"]
tag_style    = "tag"
yoda_legends = "label"

# ── Quantity catalogue (use = 0: applied only when scanned or pinned in [settle.use]) ──

[sweep.cmnd.beams]
type   = "beams"                          # [eA, eB] → frameType 2; single eCM → frameType 1
values = [[41, 5], [100, 10], [275, 18]]
labels = ["5x41 GeV ($\\sqrt{s}$ = 28.6 GeV)", "10x100 GeV ($\\sqrt{s}$ = 63.2 GeV)", "18x275 GeV ($\\sqrt{s}$ = 140.7 GeV)"]
tags   = ["5x41", "10x100", "18x275"]

[sweep.cmnd.lepton]
type    = "pythia"
setting = "Beams:idB"
values  = [11, -11]
labels  = ["$e^-$", "$e^+$"]
tags    = ["em", "ep"]

[sweep.cmnd.pdf]
type    = "pythia"
setting = "PDF:pSet"
values  = [
  "LHAPDF6:MSTW2008lo68cl",
  "LHAPDF6:NNPDF23_lo_as_0130_qed",
  "LHAPDF6:NNPDF23_nlo_as_0119_qed",
  "LHAPDF6:PDF4LHC21_40",
]
labels  = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4 LHC21.40"]
tags    = ["MSTW", "NNLO", "NNNLO", "LHC21"]

[sweep.cmnd.pt0ref]
type    = "pythia"
setting = "MultipartonInteractions:pT0Ref"
values  = [3.0, 3.2, 3.4]
labels  = ["pT0Ref = 3.0 GeV", "pT0Ref = 3.2 GeV", "pT0Ref = 3.4 GeV"]
tags    = ["pt30", "pt32", "pt34"]

[sweep.cmnd.mpi]
type    = "pythia"
setting = "PartonLevel:MPI"
values  = [true, false]
labels  = ["MPI on", "MPI off"]
tags    = ["mpi", "nompi"]

[sweep.cmnd.pthatmin]                     # generation cut; should sit below the jet ETMIN
type    = "pythia"
setting = "PhaseSpace:pTHatMin"
values  = [2.0, 3.0, 4.0, 6.0]
labels  = ["$\\hat{p}_T > 2$ GeV", "$\\hat{p}_T > 3$ GeV", "$\\hat{p}_T > 4$ GeV", "$\\hat{p}_T > 6$ GeV"]
tags    = ["pth2", "pth3", "pth4", "pth6"]

[sweep.cmnd.process]
type    = "pythia"
setting = "Photon:ProcessType"
values  = [0, 1, 2]                       # proton is beam A: 2 = direct photon
labels  = ["resolved + direct", "resolved", "direct"]
tags    = ["allproc", "resolved", "direct"]

[sweep.rivet.radius]
type    = "option"
option  = "R"
values  = [0.4, 0.7, 1.0]
labels  = ["R = 0.4", "R = 0.7", "R = 1.0"]
tags    = ["r04", "r07", "r10"]

[sweep.rivet.etmin]
type    = "option"
option  = "ETMIN"
values  = [4.0, 5.0, 6.0]
labels  = ["$E_T > 4$ GeV", "$E_T > 5$ GeV", "$E_T > 6$ GeV"]
tags    = ["et4", "et5", "et6"]

[yoda]
plot_merge_type = 1
void_empty      = true                    # blank bins empty in every curve
min_entries     = 10                      # blank bins with < 10 raw entries in any curve
auto_range      = true                    # clip x axes to bins with content
range_pad       = 1                       # keep one empty bin each side
rivet_refs      = true                    # ZEUS reference data ships with Rivet
use_data        = false
data_hist       = true
data_file       = "datasets/zeus_eic.yoda"
data_legend     = "Data"
data_reference  = true

[rivpyth]
project    = "PhotoProduction"
generator  = "generator.exe"
serial     = 1
yoda_file  = "zeus.yoda"
plugin_dir = "."
threads    = 20
path_literal = false
