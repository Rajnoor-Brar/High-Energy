# eic.toml — every EIC photoproduction study in one file.
#
#   rivpyth configs/PhotoProduction/eic.toml --study <name>     # generate + analyse
#   ydmrg   configs/PhotoProduction/eic.toml --study <name>     # overlay plot pages
#   ydplt   configs/PhotoProduction/eic.toml --study <name>     # one page per point
#
# Without --study the file runs a single point: every quantity at its catalogue `use` default
# (5x41 GeV, e-, pT0Ref 3.2, MPI on).
# One-offs: --pin cmnd.beams=10x100, --across "cmnd.beams,cmnd.pdf", --overlay cmnd.pdf
# The same physics point always gets the same file name, so studies share runs
# (e.g. study "energies" point 18x275 = study "single").

[analysis]                                # run control
cmnd_file   = "photo_ep.cmnd"             # base physics in configs/PhotoProduction/
event_count = 1_000_000                   # Main:numberOfEvents
seed        = 270403                      # seed + (point-1) * seed_step

[yoda]
use_data        = true                   
plot_merge_type = 1                       # 1 = overlay; 2 = yodamerge (seed studies only)
void_empty      = false                    # blank bins empty in every curve
min_entries     = 1                      # blank bins with < 10 raw entries in any curve
auto_range      = true                    # clip x axes to bins with content
range_pad       = 1                       # keep one empty bin each side
data_hist       = true
data_file       = "datasets/zeus_eic.yoda"
data_legend     = "Data"
data_reference  = true

[rivpyth]
project    = "PhotoProduction"
generator  = "generator.exe"
serial     = 3
yoda_file  = "eic.yoda"
plugin_dir = "."
threads    = 20                           # Parallelism:numThreads
path_literal = false

[settle.rivet]                            # fixed analysis
plugin = "photo_eic"                      # options: YMIN YMAX WMIN WMAX Q2MAX ETMIN ETMIN2 ETAMAX R CHETAMAX CHPTMIN
# options = { R = 1.0 }

[settle.use]                            # file-wide pins; override the catalogue `use` defaults
"cmnd.beams" = "27x920"
"cmnd.lepton" = "ep"

[sweep]                                   # default scan: none (a single run)
across       = ["cmnd.pdf"]
tag_style    = "tag"
yoda_legends = "label"
seed_step    = 1


# ── Quantity catalogue ──
# `use = n` applies value n everywhere unless the quantity is scanned or pinned
# ([settle.use], a study's `pin`, --pin); no `use` = left to the base cmnd.

[sweep.cmnd.beams]
type   = "beams"                          # [eA, eB] → frameType 2; single eCM → frameType 1
values = [[41, 5], [100, 10], [275, 18], [920, 27.5]]
labels = ["5x41 GeV ($\\sqrt{s}$ = 28.6 GeV)", "10x100 GeV ($\\sqrt{s}$ = 63.2 GeV)", "18x275 GeV ($\\sqrt{s}$ = 140.7 GeV)", "27x920 GeV ($\\sqrt{s}$ = 95.6 GeV)"]
tags   = ["5x41", "10x100", "18x275","27x920"]
use    = 1                                # default energy for the PDF scan

[sweep.cmnd.lepton]
type    = "pythia"
setting = "Beams:idB"
values  = [11, -11]
labels  = ["$e^-$", "$e^+$"]
tags    = ["em", "ep"]
use    = 1                                # default lepton for the PDF scan

[sweep.cmnd.pdf]
type    = "pythia"
setting = "PDF:pSet"
values  = [
  "LHAPDF6:MSTW2008lo68cl",
  "LHAPDF6:NNPDF23_lo_as_0130_qed",
  "LHAPDF6:NNPDF23_nlo_as_0119_qed",
  "LHAPDF6:PDF4LHC21_40",
]
labels  = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4 LHC21.40"]
tags    = ["MSTW", "NNLO", "NNNLO", "LHC21"]
use = 2

[sweep.cmnd.pt0ref]
type    = "pythia"
setting = "MultipartonInteractions:pT0Ref"
values  = [3.0, 3.2, 3.4]
labels  = ["pT0Ref = 3.0 GeV", "pT0Ref = 3.2 GeV", "pT0Ref = 3.4 GeV"]
tags    = ["pt30", "pt32", "pt34"]
use     = 2

[sweep.cmnd.mpi]
type    = "pythia"
setting = "PartonLevel:MPI"
values  = [true, false]
labels  = ["MPI on", "MPI off"]
tags    = ["mpi", "nompi"]
use     = 1

[sweep.cmnd.pthatmin]                     # generation cut; should sit below the jet ETMIN
type    = "pythia"
setting = "PhaseSpace:pTHatMin"
values  = [2.0, 3.0, 4.0, 6.0]
labels  = ["$\\hat{p}_T > 2$ GeV", "$\\hat{p}_T > 3$ GeV", "$\\hat{p}_T > 4$ GeV", "$\\hat{p}_T > 6$ GeV"]
tags    = ["pth2", "pth3", "pth4", "pth6"]

[sweep.cmnd.process]
type    = "pythia"
setting = "Photon:ProcessType"
values  = [0, 1]                          # 0 = all photon processes, 1 = resolved only
labels  = ["resolved + direct", "resolved"]
tags    = ["allproc", "resolved"]
# Direct-only is not available here: with the photon from the lepton (beam B), Pythia 8.317
# fails init() for ProcessType = 2 ("all processes have vanishing cross sections"), and
# ProcessType = 3 only generates HardQCD (resolved) processes. Needs a physics check before use.

[sweep.rivet.radius]
type    = "option"
option  = "R"
values  = [0.4, 0.7, 1.0]
labels  = ["R = 0.4", "R = 0.7", "R = 1.0"]
tags    = ["r04", "r07", "r10"]

[sweep.rivet.etmin]
type    = "option"
option  = "ETMIN"
values  = [4.0, 5.0, 6.0]
labels  = ["$E_T > 4$ GeV", "$E_T > 5$ GeV", "$E_T > 6$ GeV"]
tags    = ["et4", "et5", "et6"]

# ── Studies (--study <name>) ──

[study.single]
description = "One run at the default beams (eic63/eic140: --pin cmnd.beams=10x100 / 18x275)"
across      = []

[study.pdf]
description = "Proton-PDF comparison at 5x41 GeV (was eic28.toml)"
across      = ["cmnd.pdf"]

[study.energies]
description = "Beam-energy comparison (was eic_energies.toml)"
across      = ["cmnd.beams"]

[study.energy_pdf]
description = "Beams x PDF grid: one page per energy with PDF curves"
across      = ["cmnd.beams", "cmnd.pdf"]
overlay     = "cmnd.pdf"

[study.mpi]
description = "MPI pT0Ref scan at 18x275 with MPI on (was eic_mpi.toml)"
across      = ["cmnd.pt0ref"]
pin         = { "cmnd.beams" = "18x275" }

[study.mpi_onoff]
description = "MPI on vs off at 18x275"
across      = ["cmnd.mpi"]
pin         = { "cmnd.beams" = "18x275" }

[study.mpi_grid]
description = "pT0Ref x MPI grid: one page per MPI setting with pT0Ref curves"
across      = ["cmnd.pt0ref", "cmnd.mpi"]
overlay     = "cmnd.pt0ref"
pin         = { "cmnd.beams" = "18x275" }

[study.pthatmin]
description = "Generation-cut stability at 5x41 (base pTHatMin = 6 GeV is above the jet ETMIN = 5 GeV)"
across      = ["cmnd.pthatmin"]

[study.process]
description = "All photon processes vs resolved only at 18x275 (direct-only unavailable, see catalogue)"
across      = ["cmnd.process"]
pin         = { "cmnd.beams" = "18x275" }

[study.radius]
description = "Jet radius (analysis option R) at 18x275"
across      = ["rivet.radius"]
pin         = { "cmnd.beams" = "18x275" }
