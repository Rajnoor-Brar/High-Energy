[analysis]                             # run control only
cmnd_file   = "photo_ep.cmnd"          # base cmnd in configs/<project>/
event_count = 1_000_000                # 0 = Main:numberOfEvents from the base cmnd
seed        = 270403                   # 0 = keep the cmnd seed; else seed + (point-1)*seed_step

[settle]                               # what is held fixed in this run
# tag = "pthat3"                       # appended to every name (for settings that give no tag)

[settle.cmnd]                          # "Group:key" = value, or shorthands beams / seed
"PhaseSpace:pTHatMin" = 6.0

[settle.rivet]
plugin  = "photo_eic"
options = { R = 1.0 }                  # a scanned option quantity of the same name wins

[settle.use]                           # pin declared quantities while they are not scanned
"cmnd.beams" = "5x41"                  # by tag, or one-based index

[sweep]                                # what varies
across       = [["cmnd.beams", "rivet.ymax"], "cmnd.pdf"]   # lists move together; groups form a grid
overlay      = "cmnd.pdf"              # group drawn as curves; other groups -> one page per value
only         = 0                       # 0 = all points; i = one-based point
tag_style    = "tag"                   # tag | value | index
yoda_legends = "label"                 # label | tag | value
seed_step    = 1
skip_existing = false

[sweep.cmnd.beams]                     # [eA, eB] -> frameType 2; eCM -> frameType 1
type   = "beams"
values = [[41, 5], [275, 18]]
tags   = ["5x41", "18x275"]
use    = 1                             # default while not scanned (0 = leave the cmnd alone)

[sweep.cmnd.pdf]                       # scalar values need `setting`; tables set several keys
type    = "pythia"
setting = "PDF:pSet"
values  = ["LHAPDF6:MSTW2008lo68cl", "LHAPDF6:NNPDF23_lo_as_0130_qed"]
labels  = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO"]
tags    = ["MSTW", "NNLO"]

[sweep.rivet.ymax]                     # Rivet analysis option; also type = "plugin"
type      = "option"
option    = "YMAX"
values    = [0.85, 0.80]
in_legend = false                      # leave a coupled quantity out of legends

[yoda]
plot_merge_type = 1                    # 1 = overlay; 2 = yodamerge (seed sweeps only)
use_data        = false
data_hist       = true
data_file       = ""
data_legend     = "Data"
data_reference  = true
rivet_refs      = false                # true = let rivet-mkhtml load Rivet's own reference data
void_empty      = true                 # blank bins that are zero in every curve (no 0/0 ratio bars)
min_entries     = 10                   # also blank bins where any curve has fewer raw entries (0 = off)
auto_range      = true                 # clip each plot's x axis to the bins with content
range_pad       = 1                    # keep this many empty bins on each side
# plot_analysis = "photo_eic"          # common analysis name when plugins differ

[rivpyth]
project    = "PhotoProduction"
generator  = "generator.exe"
serial     = 1
yoda_file  = "eic28.yoda"
plugin_dir = "."
threads    = 20                        # Parallelism:numThreads; 0 = Pythia default (all cores)
path_literal = false                   # true: use yoda_file (and hepmc_file = FIFO path) verbatim
