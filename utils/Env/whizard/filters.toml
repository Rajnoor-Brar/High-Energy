# utils/Env/whizard/filters.toml — Whizard only prints (docs/05_Tools_Reference.md §20). A rule never fails a run.
[[rule]]
match = '^\| Starting integration'
emit  = "phase"
phase = "integrating"

[[rule]]
match = '^\| Starting simulation'
emit  = "phase"
phase = "generating"

[[rule]]
match = '^\| Events:\s+(?P<done>\d+)'
emit  = "progress"

[[rule]]
match = '^\*\*\* (?:FATAL ERROR|ERROR)'
emit  = "error"

[[rule]]
match = '^\*\*\* WARNING'
emit  = "warn"
