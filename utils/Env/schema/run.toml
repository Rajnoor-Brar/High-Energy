# utils/Env/schema/run.toml — every key a run TOML may hold (docs/04_Config_Reference.md), in one place
# (V55). The runner validates against it (runner/schema.py), the editor schema is generated from it
# (`make schema` → run.schema.json), and test_docs.py holds docs/04 to it.
#
# [<table>.<key>] fields:
#   type     "int" | "float" | "str" | "bool" | "list" | "table", or several joined by "|"
#   items    for a list: the type of its entries
#   choices  the values allowed
#   min      the smallest number allowed
#   required true: the table must set it
#   default  the runner's value when the key is left out
#   inherit  true: a configuration ([run.<cfg>]) inherits it from [run]
#   default_ok  true: the value "default" is accepted. "default" means "keep it as it is" (V55): in a
#            child it is the parent's value; at the top level nothing is set, and the tool decides.
#   page     a [plot] key a figure ([plot.figures.<figure>]) may override
#   doc      one line, for `hep explain` and the editor
#
# Tables: master, run, configuration ([run.<cfg>]), prelim, quantity ([quantities.<q>]), tool
# ([tools.<tag>]: the keys every tool table may carry; a folder's [options] add its own), plot,
# figure ([plot.figures.<figure>]), data.

[sections]
order = ["master", "run", "prelim", "static", "tools", "quantities", "plot"]

# ── [master] ─────────────────────────────────────────────────────────────────────────────────

[master.master_toml]
type = "str"
doc  = "a project master overlaid on the tool folders' quantities.toml (configs/<Project>/…)"

[master.include]
type  = "str|list"
items = "str"
doc   = "run TOMLs whose tables this one starts from (configs/<Project>/…); this file wins"

# ── [run] ────────────────────────────────────────────────────────────────────────────────────

[run.name]
type     = "str"
required = true
doc      = "the run's folder: <project>/<name>/"

[run.project]
type     = "str"
required = true
doc      = "the project; a config under configs/<X>/ belongs to X"

[run.configuration]
type = "str"
doc  = "the configuration hep run runs (required unless sweep_runs)"

[run.serial]
type    = "int"
inherit = true
doc     = "the NN_ before each configuration's folder"

[run.event_count]
type    = "int"
min     = 1
inherit = true
doc     = "events per point"

[run.threads]
type    = "int"
min     = 0
default = 1
inherit = true
doc     = "threads per generator; 0 = every core"

[run.parallelism]
type    = "int|str"
choices = ["auto"]
min     = 1
default = 1
inherit = true
doc     = "points run at once; \"auto\": as many as the cores hold, cores ÷ a point's cores (V75)"

[run.description]
type = "str"
doc  = "what the run is for"

[run.sweep_runs]
type    = "bool|list"
items   = "str"
default = false
doc     = "hep run runs every configuration in turn (true), or these, in this order (V79: [\"a\", \"b\"])"

[run.notify]
type    = "str"
choices = ["none", "desktop"]
default = "none"
doc     = "\"desktop\": a notify-send when hep run ends, with its verdict (V76)"

[run.seed_type]
type    = "str"
choices = ["identity", "manual", "random"]
default = "identity"
inherit = true
doc     = "how seeds are chosen"

[run.manual_seed]
type    = "int"
min     = 1
inherit = true
doc     = "seed_type = manual: every point's seed"

# ── [run.<cfg>] ──────────────────────────────────────────────────────────────────────────────
# A configuration's value is its own, else the one it `extends` (and so on), else [run.defaults]'s (a
# table of these keys shared by every configuration), else [run]'s, else the default here. label,
# title, extends and swept are each configuration's own.

[configuration.extends]
type = "str"
doc  = "another configuration this one starts from; its own keys win"

[configuration.serial]
type       = "int"
default_ok = true
doc        = "this configuration's NN_ (else [run]'s)"

[configuration.name]
type = "str"
doc  = "this configuration's run folder (else [run].name)"

[configuration.label]
type = "str"
doc  = "this configuration's folder: NN_<label> (else its table key)"

[configuration.title]
type = "str"
doc  = "the run NN - <title> - header of a sweep"

[configuration.description]
type = "str"
doc  = "what the configuration is for"

[configuration.event_count]
type       = "int"
min        = 1
default_ok = true
doc        = "events per point (else [run]'s)"

[configuration.threads]
type       = "int"
min        = 0
default_ok = true
doc        = "threads per generator (else [run]'s); 0 = every core"

[configuration.parallelism]
type       = "int|str"
choices    = ["auto"]
min        = 1
default_ok = true
doc        = "points run at once (else [run]'s); \"auto\": cores ÷ a point's cores (V75)"

[configuration.swept]
type    = "bool"
default = true
doc     = "false: [run].sweep_runs leaves this configuration out"

[configuration.seed_type]
type       = "str"
choices    = ["identity", "manual", "random"]
default_ok = true
doc        = "how seeds are chosen (else [run]'s)"

[configuration.manual_seed]
type       = "int"
min        = 1
default_ok = true
doc        = "seed_type = manual: every point's seed (else [run]'s)"

[configuration.sweeps]
type = "list"
doc  = "swept quantities: a name is an axis, an inner list an entangled group"

[configuration.plot_points]
type  = "list"
items = "str"
doc   = "swept quantities whose grid makes the pages"

[configuration.combine]
type  = "list"
items = "str"
doc   = "swept quantities whose points are merged into one (seed replicas)"

[configuration.tools]
type     = "list"
required = true
doc      = "the chain: [A, [B, C], D]; an inner list runs together"

[configuration.pre]
type = "list"
doc  = "tools run once, before every point"

[configuration.post]
type = "list"
doc  = "tools run once, after every point"

[configuration.static]
type = "table"
doc  = "quantity = value for this configuration, over [static]"

[configuration.prelim]
type = "table"
doc  = "this configuration's [prelim]"

# ── [prelim] ─────────────────────────────────────────────────────────────────────────────────

[prelim.fifo]
type  = "list"
items = "str"
doc   = "FIFOs made in the point's folder before the tools start"

[prelim.files]
type  = "list"
items = "str"
doc   = "files made (empty) before the tools start"

[prelim.commands]
type = "list"
doc  = "commands run in the point's folder before the tools"

# ── [quantities.<q>] ─────────────────────────────────────────────────────────────────────────

[quantity.values]
type     = "list"
required = true
doc      = "the values"

[quantity.tags]
type  = "list"
doc   = "one per value: folder and point names"

[quantity.labels]
type  = "list"
doc   = "one per value: legend text"

[quantity.shape]
type = "str|list"
doc  = "a user quantity's value shape, as the vocabulary's: \"pdg\", \"float|int\", [\"float\", \"float\"] (V76)"

[quantity.styles]
type  = "list"
items = "table"
doc   = "one per value: its curves' look, { colour, line, width } (V67)"

[quantity.key]
type = "str|table"
doc  = "the native key, or { <tool or tag> = key }"

[quantity.target]
type = "str|list"
doc  = "<tag>, <tag>/<analysis> or <tag>/seed"

[quantity.format]
type = "str"
doc  = "how the value is written: a Python format, \"{}*GeV\""

[quantity.description]
type = "str"
doc  = "what the quantity is"

[quantity.exclude]
type  = "list"
doc   = "1-based value places a sweep leaves out"

# ── [tools.<tag>] ────────────────────────────────────────────────────────────────────────────

[tool.tool]
type     = "str"
required = true
doc      = "a standard tool (a folder of utils/Env/) or custom"

[tool.baseconfig]
type = "str|list"
doc  = "base card(s), configs/<Project>/…"

[tool.input]
type = "str|list"
doc  = "what it reads: an interface or a file"

[tool.output_file]
type = "str|list"
doc  = "what it writes: an interface or a product"

[tool.timeout]
type = "float"
min  = 0
doc  = "seconds before it is stopped (0: never)"

[tool.stall_after]
type = "float"
min  = 0
doc  = "seconds of silence before it counts as stalled (default 300)"

[tool.status]
type    = "str"
choices = ["standard", "filters", "none"]
doc     = "how its progress is read: the status protocol, its log's filter rules, or not at all"

[tool.filters]
type = "str"
doc  = "a filters.toml of your own (configs/<Project>/…), in place of its folder's"

[tool.executable]
type = "str"
doc  = "custom/module: build/<project>/<name>, or path:<command>"

[tool.arguments]
type = "list"
doc  = "custom: its arguments"

[tool.consumes]
type  = "list"
items = "str"
doc   = "custom/module: quantities it reads from its config"

[tool.config]
type = "table"
doc  = "custom/module: written to config/<tag>.toml"

[tool.streamable]
type = "bool"
doc  = "it can read a FIFO"

[tool.consumes_events]
type = "bool"
doc  = "its event count is checked against the producer's"

[tool.settings]
type = "table"
doc  = "native card settings, as written: \"HeavyIon:mode\" = 1 (over the base card, under quantities)"

[tool.cores]
type = "int"
min  = 1
doc  = "cores it keeps busy, for --plan's note (default: estimated)"

[tool.shards]
type    = "int"
min     = 1
default = 1
doc     = "K processes on a share of the events each"

# ── [plot] ───────────────────────────────────────────────────────────────────────────────────

[plot.backend]
type       = "str|list"
items      = "str"
choices    = ["root", "yoda", "mpl", "both"]
default    = "root"
default_ok = true
doc        = "root (Paint), yoda (rivet-mkhtml), mpl (matplotlib, V71), a list of them, or both (root and yoda)"

[plot.formats]
type       = "list"
items      = "str"
choices    = ["pdf", "png", "svg", "eps"]
default    = ["pdf"]
default_ok = true
doc        = "the pages' formats"

[plot.band]
page       = true
type  = "list"
items = "str"
doc   = "curve-axis quantities drawn as one curve, their first value, with the min–max envelope of all their values (V69)"

[plot.objects]
type       = "list"
items      = "str"
default_ok = true
doc        = "YODA path globs that get pages (default: every 1D object)"

[plot.ratio]
page       = true
type       = "bool"
default    = false
default_ok = true
doc        = "a ratio pad"

[plot.y_gutter]
page       = true
type       = "float"
min        = 0
default    = 0.5
default_ok = true
doc        = "the top of the y axis at (1 + g) × the largest value"

[plot.x_gutter]
page       = true
type       = "float"
min        = 0
default_ok = true
doc        = "x widened by g of its span"

[plot.logy]
page       = true
type       = "bool"
default_ok = true
doc        = "log y (default: the .plot's)"

[plot.logx]
page       = true
type       = "bool"
default_ok = true
doc        = "log x (default: the .plot's)"

[plot.logz]
page       = true
type       = "bool"
default_ok = true
doc        = "a heat map's log z (default: the .plot's LogZ, V87)"

[plot.auto_range]
page       = true
type       = "bool"
default    = true
default_ok = true
doc        = "x clipped to the bins with content"

[plot.normalise]
page       = true
type       = "str|bool"
choices    = ["area", false]
default    = false
default_ok = true
doc        = "\"area\": every curve and the data scaled to unit area over the bins drawn (V68)"

[plot.void_empty]
page       = true
type       = "bool"
default    = false
default_ok = true
doc        = "blank the bins empty in every curve"

[plot.use_data]
page       = true
type       = "bool"
default    = true
doc        = "false: [plot.data] stays but is not drawn"

[plot.min_entries]
page       = true
type       = "int"
min        = 0
default    = 0
default_ok = true
doc        = "blank the bins with fewer raw entries"

[plot.range_pad]
page       = true
type       = "int"
min        = 0
default    = 0
default_ok = true
doc        = "whole bins added around auto_range"

[plot.root_style]
type       = "str"
default_ok = true
doc        = "a style file over base.toml (configs/<Project>/…)"

[plot.title]
page       = true
type       = "str"
default_ok = true
doc        = "centred above the frame (default: the .plot's Title)"

[plot.title_left]
page       = true
type       = "str"
default_ok = true
doc        = "above the frame's top-left corner"

[plot.title_right]
page       = true
type       = "str"
default_ok = true
doc        = "above the frame's top-right corner"

[plot.legend_header]
page       = true
type       = "str"
default_ok = true
doc        = "the legend's first line (default: the .plot's LegendTitle)"

[plot.data]
type = "table"
doc  = "reference data: file, legend, map"

[plot.style]
type = "table"
doc  = "the style over base.toml"

[plot.figures]
type = "table"
doc  = "[plot.figures.<figure>]: the figures, each a recipe for pages (08_Figures)"

# ── [plot.figures.<figure>]: a recipe for pages ─────────────────────────────────────────────
# A figure takes every [plot] key marked `page = true`, meaning the same for its pages ("default":
# [plot]'s value), and these, which only a figure sets (schema.keys("figure") joins the two).

[figure.class]
type    = "str"
choices = ["defined", "overlay", "merged", "compare", "derived", "scan"]
default = "defined"
doc     = "how its pages are built: defined (an analysis object's own), overlay (several objects of each point), merged (the objects' pages with the points merged over `over`), compare (the objects' pages across configurations), derived (a new object from the objects, per point), scan (one number per point against a swept quantity)"

[figure.type]
type    = "str"
choices = ["Hist1D", "Scatter2D", "HeatMap"]
doc     = "what is drawn: Hist1D (steps), Scatter2D (a marker per bin, as data: V86), HeatMap (a 2D object coloured, a page per point: V87); default: from the objects (2D: HeatMap), a scan's Scatter2D"

[figure.name]
type = "str"
doc  = "its pages' file stem (default: the figure's key; a defined figure's pages keep the object's name)"

[figure.objects]
type  = "list"
items = "str"
doc   = "the objects: YODA path globs, matched against the short name (d01-x01-y01) or the full path"

[figure.op]
type    = "str"
choices = ["ratio", "difference", "sum", "projection-x", "projection-y"]
doc     = "a derived figure's: of its two objects (ratio, difference, sum), or of its 2D histogram (projection-x, -y) (V84)"

[figure.x]
type = "str"
doc  = "a scan figure's x: a swept quantity with numeric values, a curve axis (V85)"

[figure.y]
type = "str"
doc  = "a scan figure's y: sigma, entries, or integral, mean, bin:N of its object (V85)"

[figure.over]
type  = "list"
items = "str"
doc   = "a merged figure's: the curve axes whose points it merges, by the combine folder's command (V82)"

[figure.configurations]
type  = "list"
items = "str"
doc   = "a compare figure's configurations (default: the sweep_runs ones), each a curve per point (V83)"

[figure.labels]
type  = "list"
items = "str"
doc   = "an overlay's legend label per object; a compare figure's per configuration"

[figure.x_label]
type       = "str"
default_ok = true
doc        = "the x axis title (default: the .plot's)"

[figure.y_label]
type       = "str"
default_ok = true
doc        = "the y axis title (default: the .plot's)"

[figure.style]
type = "table"
doc  = "a style layer for these pages"

# ── [plot.data] ──────────────────────────────────────────────────────────────────────────────

[data.file]
type = "str"
doc  = "a YODA under datasets/, or rivet:<Analysis>"

[data.legend]
type    = "str"
default = "Data"
doc     = "the data's legend entry"

[data.map]
type = "table"
doc  = "object = reference path, explicitly"
