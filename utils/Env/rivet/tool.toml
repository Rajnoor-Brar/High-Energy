# utils/Env/rivet/tool.toml — Rivet as a process, reading HepMC (docs/05_Tools_Reference.md §3).
[tool]
category        = "analysis-application"
executable      = "rivet"
streamable      = true
status          = "filters"
consumes_events = true

[card]
style = "none"                      # everything is a flag

[command]
argv = ["{exe}", "-o", "{partial:output}", "{analyses}", "{input}"]
env  = { RIVET_ANALYSIS_PATH = "{repo}/build/Rivet" }

[options]
analyses = { kind = "list", required = true }
options  = { kind = "table" }       # analysis options applied to every analysis

[outputs]
products    = ["yoda"]
event_count = "yoda:/RAW/_EVTCOUNT"  # the count check against the producer's sidecar (L7)

[exports.analyses]
gives = ["analyses", "plugin_path"]

[identity]
files   = ["{repo}/build/Rivet/Rivet_{analysis}.so"]
version = ["rivet", "--version"]

[checks]
# Every analysis must have a .info (an unknown name is refused before anything runs), and every
# option given to it must be declared there: an undeclared option is silently ignored by Rivet and
# gives identical curves (L19, v1's 00/B14). Our plugins are copied to build/Rivet; Rivet's own
# analyses are in its data directory.
info_dirs         = ["{repo}/build/Rivet"]
info_dirs_command = ["rivet-config", "--datadir"]
