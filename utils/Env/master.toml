# utils/Env/master.toml — how each standard tool consumes named quantities (docs/04_Config_Reference.md §3).
#
# [quantities.<tool>.compatible_quantities].<quantity> = one of
#   { key = "K" }                     the card line K = value
#   { keys = ["K1", "K2"] }           a list value spread over several keys, in order
#   { key = "K", format = "X{}" }     with the value written through a format
#   { flag = "-N" }                   a command-line argument instead of a card line
#   { render = "fn" }                 a function in utils/Env/<tool>/render.py
# A project may overlay this with configs/<Project>/master.toml ([master].master_toml).

[quantities.pythia.compatible_quantities]
energies = { keys = ["Beams:eA", "Beams:eB"] }      # [E_A, E_B], beam A first
sqrts    = { key = "Beams:eCM" }
beam_a   = { key = "Beams:idA" }
beam_b   = { key = "Beams:idB" }
beams    = { keys = ["Beams:idA", "Beams:idB"] }  # [id_A, id_B]
pdf      = { key = "PDF:pSet", check = "pythia_pdf" }   # as written: "LHAPDF6:<set>[/member]", checked installed (C10)
events   = { key = "Main:numberOfEvents" }          # built-in
threads  = { key = "Parallelism:numThreads" }       # built-in

# rivet consumes no named quantity: it reads beams and energies from the events, and its analysis
# options are always targeted explicitly (target = "<tag>/<analysis>", key = "<OPTION>").

[quantities.sherpa.compatible_quantities]           # keys are paths into the YAML card (render.py)
energies = { key = "BEAM_ENERGIES" }                # [E_A, E_B]: the card puts the proton first
beams    = { key = "BEAMS" }                        # [id_A, id_B]: the plan owns BEAMS, so it is set whole
sqrts    = { key = "sqrts" }                        # render.py: BEAM_ENERGIES = [√s/2, √s/2]
pdf      = { key = "PDF_SET[0]", check = "lhapdf" }  # the proton's; MPI_PDF_SET follows it
events   = { key = "EVENTS" }                       # built-in

[quantities.herwig.compatible_quantities]           # ThePEG `set` lines; events and seed are flags
# snippets/EPCollider.in puts the lepton on beam A and the proton on B; energies are [E_p, E_e]
energies = { keys = ["/Herwig/EventHandlers/Luminosity:BeamEMaxB", "/Herwig/EventHandlers/Luminosity:BeamEMaxA"], format = "{}*GeV" }
sqrts    = { key = "/Herwig/EventHandlers/Luminosity:Energy" }                # snippets/PPCollider.in's FixedCMSLuminosity

[quantities.whizard.compatible_quantities]          # SINDARIN assignments (render.py)
energies = { key = "beams_momentum" }               # [E_A, E_B]: the card names the proton first
beams    = { key = "beams" }                        # PDG codes, written as the model's names
events   = { key = "n_events" }                     # built-in

[quantities.madgraph.compatible_quantities]         # run-card values in the launch script (render.py)
energies = { keys = ["ebeam1", "ebeam2"] }          # beam 1 is the proc card's first incoming particle
beams    = { key = "beams" }                        # PDG codes, written as lpp1/lpp2
events   = { key = "nevents" }                      # built-in

