# utils/Env/pythia/tool.toml — the standard Pythia tool: build/App_Pythia.exe (docs/05_Tools_Reference.md §15).
[tool]
category        = "event-generator"
executable      = "{repo}/build/App_Pythia.exe"
status          = "standard"
produces_events = true

[card]
style   = "append"                  # the point card is read after the base cards: last wins
ext     = "cmnd"
comment = "!"
bools   = ["on", "off"]
# Seeds from the point's identity (02 §8). Random:seed is always written, so a serial Pythia in an
# integrated program is seeded too; PythiaParallel reads Parallelism:seeds (L4).
seed          = ["Random:setSeed = on", "Random:seed = {seed}"]
seed_parallel = ["Parallelism:seeds = {{{seeds}}}"]
# A shower of an LHE file from an earlier group (MadGraph): the base card sets Beams:frameType = 4.
# Without an input the line is left out, so a generation card is unchanged.
footer        = ["Beams:LHEF = {input}"]

[command]
argv = ["{exe}", "{outputs}", "{cards}"]

[outputs]
sidecar = "{output}.json"           # App_Pythia writes it next to its first output
deal    = true                      # it can deal events among a sharded tool's inputs (A+B+C, V31)

[exports.cmnd]
alias = "card"                      # pythia_cmnd = pythia_card

[identity]
files   = ["{exe}"]
version = ["pythia8-config", "--version"]
