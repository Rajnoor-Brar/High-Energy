# utils/Env/madgraph/filters.toml — MadGraph only prints (docs/05_Tools_Reference.md §20). A rule never fails a run.
[[rule]]
match = '^INFO: (?:Running Survey|Refine results|Combining Events|Idle:)'
emit  = "phase"

[[rule]]
match = '(?:Error|ERROR|Command .* failed)'
emit  = "error"

[[rule]]
match = '^WARNING'
emit  = "warn"

[defaults]
last_line = true
