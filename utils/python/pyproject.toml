[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hekit"
version = "0.1.0"
description = "Orchestration for the High-Energy toolkit: configuration, sweeps, runs, results, plots"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13", "tomli_w>=1.0"]

[project.optional-dependencies]
# All of these are already in the toolchain venv; listed so a fresh environment can be built.
plot = ["matplotlib", "mplhep", "hist", "uproot"]
ml = ["onnxruntime"]
proc = ["scipy"]
dev = ["pytest"]

[project.scripts]
hep = "hekit.cli:main"

[tool.setuptools.packages.find]
include = ["hekit*"]

[tool.pytest.ini_options]
# Applies when pytest runs from utils/python; the repository tests use the root configuration.
testpaths = ["../../tests"]
