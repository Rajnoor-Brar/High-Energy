# Global histogram limits defaults — loaded first by Config::limitExtractor.
# Project-specific limits files (e.g. configs/Lambda_Limits.toml) are merged
# on top; any key present there overrides the value here.
#
# All quantity sections must live under [record.limits.*].
# Five RangeSize levels per quantity: Minute / Small / Moderate / Large / Extreme.

