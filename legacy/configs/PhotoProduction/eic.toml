# eic.toml — every EIC photoproduction study in one file.
#
#   rivpyth configs/PhotoProduction/eic.toml --study <name>     # generate + analyse
#   ydmrg   configs/PhotoProduction/eic.toml --study <name>     # overlay plot pages
#   ydplt   configs/PhotoProduction/eic.toml --study <name>     # one page per point
#
# Without --study the file scans [sweep].across (the PDF set) with every other quantity at its
# pinned or catalogue value: 27x920 GeV e+p ([settle.use]), pT0Ref 3.2, MPI on.
# One-offs: --pin cmnd.beams=10x100, --across "cmnd.beams,cmnd.pdf", --overlay cmnd.pdf
# The same physics point always gets the same file name, so studies share runs
# (e.g. study "energies" point 18x275 = study "single").

[analysis]                                # run control
cmnd_file   = "photo_ep.cmnd"             # base physics in configs/PhotoProduction/
event_count = 1_000_000                   # Main:numberOfEvents
seed        = 270403                      # seed + (point-1) * seed_step

[yoda]
# use_data = false: datasets/zeus_eic.yoda holds the ZEUS_2012_I1116258 reference, whose
# histogram names (d01…) match photo_eic's but describe different observables and binning
# (00/B5). Overlaying it produced silently trimmed, mismatched "data" curves.
use_data        = false
plot_merge_type = 1                       # 1 = overlay; 2 = yodamerge (seed studies only)
void_empty      = false                   # true = blank bins that are zero in every curve
min_entries     = 1                       # blank bins with fewer than this many raw entries in any curve
auto_range      = true                    # clip x axes to bins with content
range_pad       = 1                       # keep one empty bin each side
data_hist       = true
data_file       = "datasets/zeus_eic.yoda"
data_legend     = "Data"
data_reference  = true

[rivpyth]
project    = "PhotoProduction"
generator  = "generator.exe"
serial     = 3
yoda_file  = "eic.yoda"
plugin_dir = "."
threads    = 20                           # Parallelism:numThreads
path_literal = false

[settle.rivet]                            # fixed analysis
plugin = "photo_eic"                      # options: YMIN YMAX WMIN WMAX Q2MAX ETMIN ETMIN2 ETAMAX R CHETAMAX CHPTMIN
# options = { R = 1.0 }

[settle.use]                            # file-wide pins; override the catalogue `use` defaults
"cmnd.beams" = "27x920"
"cmnd.lepton" = "ep"

[sweep]                                   # default scan: the PDF sets
across       = ["cmnd.pdf"]
tag_style    = "tag"
yoda_legends = "label"
seed_step    = 20                         # >= [rivpyth].threads: Pythia gives thread i seed+i (00/B2)


# ── Quantity catalogue ──
# `use = n` applies value n everywhere unless the quantity is scanned or pinned
# ([settle.use], a study's `pin`, --pin); no `use` = left to the base cmnd.

[sweep.cmnd.beams]
type   = "beams"                          # [eA, eB] → frameType 2; single eCM → frameType 1
values = [[41, 5], [100, 10], [275, 18], [920, 27.5]]
labels = ["5x41 GeV ($\\sqrt{s}$ = 28.6 GeV)", "10x100 GeV ($\\sqrt{s}$ = 63.2 GeV)", "18x275 GeV ($\\sqrt{s}$ = 140.7 GeV)", "27x920 GeV ($\\sqrt{s}$ = 318.1 GeV)"]
tags   = ["5x41", "10x100", "18x275","27x920"]
use    = 1                                # catalogue default; [settle.use] pins 27x920

[sweep.cmnd.lepton]
type    = "pythia"
setting = "Beams:idB"
values  = [11, -11]
labels  = ["$e^-$", "$e^+$"]
tags    = ["em", "ep"]
use    = 1                                # catalogue default; [settle.use] pins ep

[sweep.cmnd.pdf]
type    = "pythia"
setting = "PDF:pSet"
values  = [
  "LHAPDF6:MSTW2008lo68cl",
  "LHAPDF6:NNPDF23_lo_as_0130_qed",
  "LHAPDF6:NNPDF23_nlo_as_0119_qed",
  "LHAPDF6:PDF4LHC21_40",
]
labels  = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4 LHC21.40"]
# The tags are historical labels, not orders: NNLO = NNPDF2.3 LO, NNNLO = NNPDF2.3 NLO (00/B12;
# renamed with an alias map in the schema-2 migration, P1-S06).
tags    = ["MSTW", "NNLO", "NNNLO", "LHC21"]
use = 2                                   # NNPDF2.3 QCD+QED LO while not scanned

[sweep.cmnd.pt0ref]
type    = "pythia"
setting = "MultipartonInteractions:pT0Ref"
values  = [3.0, 3.2, 3.4]
labels  = ["pT0Ref = 3.0 GeV", "pT0Ref = 3.2 GeV", "pT0Ref = 3.4 GeV"]
tags    = ["pt30", "pt32", "pt34"]
use     = 2

[sweep.cmnd.mpi]
type    = "pythia"
setting = "PartonLevel:MPI"
values  = [true, false]
labels  = ["MPI on", "MPI off"]
tags    = ["mpi", "nompi"]
use     = 1

[sweep.cmnd.pthatmin]                     # generation cut; should sit below the jet ETMIN
type    = "pythia"
setting = "PhaseSpace:pTHatMin"
values  = [2.0, 3.0, 4.0, 6.0]
labels  = ["$\\hat{p}_T > 2$ GeV", "$\\hat{p}_T > 3$ GeV", "$\\hat{p}_T > 4$ GeV", "$\\hat{p}_T > 6$ GeV"]
tags    = ["pth2", "pth3", "pth4", "pth6"]

[sweep.cmnd.process]
# Measured with this base cmnd (proton = beam A, photon from the lepton = beam B), Pythia 8.317,
# 400 events at 27x920 (00/B13):
#   0 (mix) and 1 (resolved-resolved) give identical events and sigma (74261.7 pb): every hard
#     process is resolved-resolved HardQCD (codes 111-124). PhotonParton:all never contributes.
#   2 (resolved-direct = the direct contribution when the hadron is beam A) fails init().
#   3 (direct-resolved) initialises, switches MPI off ("unresolved photon"), and still produces
#     only HardQCD codes; sigma differs by about 1 %.
# So the direct contribution is NOT reachable with this card, and this study is currently a null
# comparison (two independent samples of the same physics, since the seeds differ). Enabling the
# direct contribution needs a separate card; see the P0-S05 log.
type    = "pythia"
setting = "Photon:ProcessType"
values  = [0, 1]                          # identical here; kept until the direct card exists
labels  = ["resolved + direct", "resolved"]
tags    = ["allproc", "resolved"]

[sweep.rivet.radius]
type    = "option"
option  = "R"
values  = [0.4, 0.7, 1.0]
labels  = ["R = 0.4", "R = 0.7", "R = 1.0"]
tags    = ["r04", "r07", "r10"]

[sweep.rivet.etmin]
type    = "option"
option  = "ETMIN"
values  = [4.0, 5.0, 6.0]
labels  = ["$E_T > 4$ GeV", "$E_T > 5$ GeV", "$E_T > 6$ GeV"]
tags    = ["et4", "et5", "et6"]

# ── Studies (--study <name>) ──

[study.single]
description = "One run at the pinned beams (other energies: --pin cmnd.beams=10x100 / 18x275)"
across      = []

[study.pdf]
description = "Proton-PDF comparison at the pinned beams (formerly eic28.toml)"
across      = ["cmnd.pdf"]

[study.energies]
description = "Beam-energy comparison at the pinned PDF (formerly eic_energies.toml)"
across      = ["cmnd.beams"]

[study.energy_pdf]
description = "Beams x PDF grid: one page per energy with PDF curves"
across      = ["cmnd.beams", "cmnd.pdf"]
overlay     = "cmnd.pdf"

[study.mpi]
description = "MPI pT0Ref scan at 18x275 with MPI on (formerly eic_mpi.toml)"
across      = ["cmnd.pt0ref"]
pin         = { "cmnd.beams" = "18x275" }

[study.mpi_onoff]
description = "MPI on vs off at 18x275"
across      = ["cmnd.mpi"]
pin         = { "cmnd.beams" = "18x275" }

[study.mpi_grid]
description = "pT0Ref x MPI grid: one page per MPI setting with pT0Ref curves"
across      = ["cmnd.pt0ref", "cmnd.mpi"]
overlay     = "cmnd.pt0ref"
pin         = { "cmnd.beams" = "18x275" }

[study.pthatmin]
description = "Generation-cut stability at the pinned beams; the base pTHatMin = 6 GeV sits above the jet ETMIN = 5 GeV, which biases the lowest-ET jets (00/B27) - this study measures that"
across      = ["cmnd.pthatmin"]

[study.process]
description = "Photon:ProcessType 0 vs 1 at 18x275 - a null comparison with this card, see the catalogue note (00/B13)"
across      = ["cmnd.process"]
pin         = { "cmnd.beams" = "18x275" }

[study.radius]
description = "Jet radius (analysis option R) at 18x275"
across      = ["rivet.radius"]
pin         = { "cmnd.beams" = "18x275" }
