# ── Per-set axis bounds ───────────────────────────────────────────────────────
# Flat [low, high] used directly as histogram axis ranges for each set.
# Property names match Physics::ParticleProperty / EventProperty aliases.

[record.limits.Unvalidated]
Mass               = [1, 2]
Energy             = [0, 10]
Momentum_Net       = [0, 10]
Momentum_Transverse= [0, 5]
Momentum_Z         = [0, 10]
Pseudorapidity     = [-15, 15]
Multiplicity       = [0, 5000]

[record.limits.Validated]
Mass               = [1, 2]
Energy             = [0, 100]
Momentum_Net       = [0, 100]
Momentum_Transverse= [0, 5]
Momentum_Z         = [0, 100]
Pseudorapidity     = [-15, 15]
Multiplicity       = [0, 1000]

[record.limits.Selected]
Mass               = [1, 1.3]
Energy             = [0, 100]
Momentum_Net       = [0, 100]
Momentum_Transverse= [0, 5]
Momentum_Z         = [0, 100]
Pseudorapidity     = [-15, 15]
Multiplicity       = [0, 150]

# ── Per-quantity RangeSize level bounds ───────────────────────────────────────
