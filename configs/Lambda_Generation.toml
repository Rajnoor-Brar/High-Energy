[events]
event_count = 10000

[pythia]
thread_count = 0     # docs/WriterMT.md Phase 0; 0 = auto (1/3 of hw-2)
beam_energy = 7000   # GeV
cmnd_file   = "configs/Lambda_Reconstruction.cmnd"
seed        = 270403

[record]
thread_count = 0     # docs/WriterMT.md Phase 0; 0 = auto
serial     = 99
sr_padding = 2
bin_count    = 500
hist_scaling = 1.0

[record.paths]
directory            = "output/Lambda_Reconstruction/"
output_log_directory = "logs/"
checkpoint_directory = "checkpoints/"
serialDirectory      = true
logInSubDir          = true
checkpointsInSubDir  = true

[record.file]
prefix = "Lambda_Gen"
serial = false
energy = true
events = true

[record.metadata]
dataset_name = "Lambda_MC_pp"
data_type    = "MC"
run_period   = ""
campaign     = ""
notes        = ""

[lambda]
hist_limits       = "Lambda_Limits"
delta_mass_gev    = 0.15   # GeV
delta_theta_rad   = 0.1    # radians
reserved_protons  = 20     # baseline beam protons per event (2 × Z; for Ne–Ne: 2 × 10 = 20)

[monitor]
print_interval            = 50       # events
check_interval            = 100000   # events (stall-check cadence)
checkpoint_interval       = 100000   # events between checkpoint snapshots (WriterMT.md Phase 1)
heartbeat_interval        = 2000     # milliseconds (terminal-status freshness)
terminal_refresh_interval = 2        # minutes
program_stall_threshold   = 5        # minutes
