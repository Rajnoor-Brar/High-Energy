[events]
event_count = 10_000

# ── Thread counts ─────────────────────────────────────────────────────────────
# probe/analysis are unused in Pythia generation pipelines but listed for
# completeness.  0 = auto ((hw-2)/3, floored at 1).
[threads]
probe    = 0
analysis = 0
writer   = 0
pythia   = 0

[pythia]
beam_energy = 7000   # GeV
cmnd_file   = "configs/Lambda_Reconstruction.cmnd"
seed        = 270403

[record]
serial      = 99
sr_padding  = 2
bin_count   = 500
hist_scaling = 1.0

[record.paths]
directory            = "output/Lambda_Generation/"
output_log_directory = "logs/"
checkpoint_directory = "checkpoints/"
serialDirectory      = true
logInSubDir          = true
checkpointsInSubDir  = true

[record.file]
prefix = "Lambda_Gen"
serial = false
energy = true
events = true

[record.metadata]
dataset_name = "Lambda_MC_pp"
data_type    = "MC"
run_period   = ""
campaign     = ""
notes        = ""

[monitor]
true_time_at_config = true

[monitor.intervals]
print_interval            = 50       # events
checkpoint_interval       = 100000   # events between checkpoint snapshots
heartbeat_interval        = 2000     # milliseconds
terminal_refresh_interval = 2        # minutes
program_stall_threshold   = 5        # minutes

[monitor.logs]
save_checkpoints = false
save_log_threads = false
save_heartbeat   = false
save_final_log   = true

[lambda]
hist_limits      = "Lambda_Limits"
delta_mass_gev   = 0.15   # GeV
delta_theta_rad  = 0.1    # radians
reserved_protons = 20     # baseline beam protons per event (2 × Z; for Ne–Ne: 2 × 10 = 20)
