[events]
probe      = true   # true = use probe input file; false = generate events with Pythia
# pythia     = false  # true = generate events with Pythia; false = use probe input file.
#if used with probe, this is given preference over probe
event_count = 1000000
nThreads    = 8      # 0 = auto (hardware_concurrency - 2)

[probe]
input_file = "output/Lambda_Data/_08/Lambda_Recons_7000GeV_10M.root"
event_particles  = [
                        ["protons",0,"Protons",["pX","pY","pZ","Energy"],"D","Index"],
                        ["pions",0,"Pions",["pX","pY","pZ","Energy"],"D","Index"]
                    ]

[record]
serial     = 11
sr_padding = 2

[record.paths]
directory            = "output/Lambda_Reconstruction/"
output_log_directory = "logs/"
checkpoint_directory = "checkpoints/"
serialDirectory      = true
logInSubDir          = true
checkpointsInSubDir  = true

[record.file]
prefix = "Lambda_Recons"
serial = false
energy = true
events = true

[record.metadata]
dataset_name = "Lambda_MC_pp"
data_type    = "MC"
run_period   = ""
campaign     = ""
notes        = ""

[lambda]
hist_limits       = "Lambda_Limits"
delta_mass_gev    = 0.15
delta_theta_rad   = 0.1
reserved_protons  = 20   # baseline beam protons per event (2 × Z; for Ne–Ne: 2 × 10 = 20)
