[run]
serial     = 1
sr_Padding = 2
nThreads   = 0   # 0 = auto (hardware_concurrency - 2)

[input]
root_file = "output/Lambda_Generation/_1/Lambda_Gen_7000GeV_10k.root"

[logging]
bin_count                 = 500
hist_scaling              = 1.0
print_interval            = 500    #events
heartbeat_interval        = 2000   #milliseconds
terminal_refresh_interval = 2      #minutes
program_stall_threshold   = 5      #minutes

[paths]
directory            = "output/Lambda_Reconstruction/"
output_log_directory = "logs/"
checkpoint_directory = "checkpoints/"
serialDirectory      = true
logInSubDir          = true
checkpointsInSubDir  = true

[file]
prefix = "Lambda_Recons"
serial = false
energy = false
events = false

[lambda]
hist_limits     = "Lambda_Limits"
delta_mass_gev  = 0.15   #GeV
delta_theta_rad = 0.1    #radians

# ── Input schema (all keys optional — defaults reproduce current branch names) ──
# [input]
# index_branch = "event_index"
# energy       = "Energy"
# px           = "pX"
# py           = "pY"
# pz           = "pZ"
#
# [input.protons]
# tree_name = "Protons"
# [input.pions]
# tree_name = "Pions"

# ── Candidate types (optional — defaults: protons + pions both enabled) ────────
# [candidates.protons]
# enabled    = true
# write_tree = true
# pid_abs    = 2212
# [candidates.pions]
# enabled    = true
# write_tree = true
# pid_abs    = 211
