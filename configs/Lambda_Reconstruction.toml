[events]
event_count = 100_000

[probe]
probe_threads    = 4              # ROOT readers; 0 = auto (1/3 of hw-2)
analysis_threads = 4               # collector threads invoking Lambda::rootAnalysis
input_file = "output/Lambda_Data/_08/Lambda_Recons_7000GeV_10M.root"

event_particles  = [
                        ["protons",0,"Protons",[["pX","D"],["pY","D"],["pZ","D"],["Energy","D"]],[["Index","I"]]],
                        ["pions",0,"Pions",[["pX","D"],["pY","D"],["pZ","D"],["Energy","D"]],[["Index","I"]]]
                    ]

#event_particles = ["prtn", "pi"]
#[probe.particle.prtn]
# spec = 0
# tree_name = "Protons"
# index_branch = ["Index","I"]
# branch_1 = ["pX","D"]
# branch_2 = ["pY","D"]
# branch_3 = ["pZ","D"]
# branch_4 = ["Energy","D"]
# #below unused, but supported
# index_1 = ["pXindex","I"] #index for branch 1; if not specified, use index_branch by default
# index_2 = ["pYindex","I"] #index for branch 2;
# and so on, if undefined use index_branch by default

[probe.index]
sorted = [true,true] # for each particle index branch
ascending = [true,true] # irrelevant if sorted = false; otherwise, specifies sort order for each particle index branch
monotonic = [true,true] # irrelevant if sorted = true ; otherwise, specifies whether indices of same values grouped together (monotonic) or interspersed (non-monotonic)

[record]
writer_threads = 4  # Writer worker pool size (per-record clone fill, merge at finalize)
serial     = 41
sr_padding = 2
bin_count = 400


[record.paths]
directory            = "output/Lambda_Reconstruction/"
output_log_directory = "logs/"
checkpoint_directory = "checkpoints/"
serialDirectory      = true
logInSubDir          = true
checkpointsInSubDir  = true

[record.file]
prefix = "Lambda_Recons"
serial = false
energy = false
events = true

[record.metadata]
dataset_name = "Lambda_MC_pp"
data_type    = "MC"
run_period   = ""
campaign     = ""
notes        = ""

[monitor]
true_time_at_config = true
print_interval            = 1000       # events
check_interval            = 100000   # events (stall-check cadence)
checkpoint_interval       = 100000   # events between checkpoint snapshots (WriterMT.md Phase 1)
heartbeat_interval        = 2000     # milliseconds (terminal-status freshness)
terminal_refresh_interval = 2        # minutes
program_stall_threshold   = 5        # minutes
# not yet used
save_checkpoints = false
save_log_threads = false
save_heartbeat = false
save_final_log = true

[pythia]
pythia_threads = 4                   # Pythia generator threads
cmnd_file = "configs/Lambda_Reconstruction.cmnd"

[lambda]
hist_limits       = "Lambda_Limits"
delta_mass_gev    = 0.15
delta_theta_rad   = 0.1
reserved_protons  = 20   # baseline beam protons per event (2 × Z; for Ne–Ne: 2 × 10 = 20)
