[paint]
default_style = "configs/defaults/Paint.toml"
root_file     = "output/Lambda_Reconstruction/_27/Lambda_Recons_GeV_1M.root"
result_dir    = "results/hist"
results       = [
    "unvalidated_count",
    "unvalidated_mass_invariant",
    "unvalidated_energy_net",
    "unvalidated_momentum_net",
    "unvalidated_momentum_transverse",
    "unvalidated_momentum_z",
    "unvalidated_pseudorapidity",
    "validated_count",
    "validated_mass_invariant",
    "validated_energy_net",
    "validated_momentum_net",
    "validated_momentum_transverse",
    "validated_momentum_z",
    "validated_pseudorapidity",
    "selected_count",
    "selected_mass_invariant",
    "selected_energy_net",
    "selected_momentum_net",
    "selected_momentum_transverse",
    "selected_momentum_z",
    "selected_pseudorapidity",
    "mass"
]
formats     = ["png"]
overwrite   = true
image_scale = 4
text_scale  = 1.0
brush_scale = 1.0

[paint.default]
mode = "single"
source_type = "H1"
draw_option = "HIST"

[paint.default.canvas]
width = 900
height = 600

[paint.mass]
mode    = "overlay"
palette = ["kBlue-6", "kRed-6", "kGreen-6"]
sources = [
    { path = "Unvalidated/Unvalidated_Mass_Invariant_Hist", label = "Unvalidated" },
    { path = "Validated/Validated_Mass_Invariant_Hist",     label = "Validated"   },
    { path = "Selected/Selected_Mass_Invariant_Hist",       label = "Selected"    },
]
title = "Mass_Invariant Distribution"
output_name = "mass"
draw_option = "HIST"
brush_scale = 0.5
fill_style  = 0
# line_width  = 2

[paint.mass.legend]
show = true

[paint.unvalidated_count]
title = "Unvalidated Candidate Count"
output_name = "unvalidated_count"
sources = [{ path = "Unvalidated/UnvalidatedCountHist" }]

[paint.unvalidated_mass_invariant]
title = "Unvalidated Mass Invariant"
output_name = "unvalidated_mass_invariant"
sources = [{ path = "Unvalidated/Unvalidated_Mass_Invariant_Hist" }]

[paint.unvalidated_energy_net]
title = "Unvalidated Energy Net"
output_name = "unvalidated_energy_net"
sources = [{ path = "Unvalidated/Unvalidated_Energy_Net_Hist" }]

[paint.unvalidated_momentum_net]
