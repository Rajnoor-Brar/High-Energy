# InProcZeus.toml — zeus_validation.toml with Pythia and Rivet in one process (InprocJets, V33).
#
#   hep run PhotoProduction/InProcZeus               default3 and default4, in turn (sweep_runs)
#   hep run PhotoProduction/InProcZeus default       the PDF comparison at 1M events
#
# The physics is zeus_validation.toml's, imported (V94, V95): its statics, quantities, tools (the
# pythia table's card photo_zs.cmnd, ZEUS_2012_I1116258), plots, and its default3 and default4 (their
# folders and event counts), so an edit there is an edit here. Only what differs is written below: the
# integrated program, which [run] gives every configuration, and the serial. The run's name is
# zeus_validation's, so these folders sit beside the chain's (03_PDFs_150M beside 02_PDFs_150M, V100).
# Instead of App_Pythia → FIFO → rivet, one program
# (modules/PhotoProduction/InprocJets.cc) runs PythiaParallel and its Rivets, and hands each event to
# Rivet as an in-memory HepMC3::GenEvent: no HepMC text, no FIFO (no [prelim] is imported). It gets
# the pythia table's point card (seeds included) and the rivet table's analyses as standard
# configurations (04 §9.4); those two tables are configured, never run.
#
# Seeds follow the generator's card, base card, binary, threads and event count (V22): with the same
# event_count, threads and seed_type as a zeus_validation configuration, a point here and the same
# point there get the same seeds, so the same events, comparable bin for bin (zeus_validation draws
# random seeds: give both seed_type = "identity" to compare them).
#
# Speed: `rivet_threads` Rivets, each on its own thread, merged at the end (V34); they need the
# SISCone patch (L29, utils/Env/patches/), without which the program refuses more than one.
# Measured, 200k events of `single` with start-up: 10 + 14 Rivets 17.3 s; zeus_validation.toml's
# chain with 12 + 10 shards 27.1 s.

[config]
import = [{ from = "zeus_validation", only = ["static", "quantities", "tools", "plot",
                                             "run.cfgs.default3", "run.cfgs.default4"] }]

[run]
serial        = 3             # zeus_validation's is 2: the same run folder, these beside its own
name          = "zeus"
project       = "PhotoProduction"
configuration = "default"
sweep_runs    = ["default3", "default4"]
seed_type     = "random"
event_count   = 1_000_000
threads       = 14            # Pythia's; 14 + 10 Rivets fill the 24 hardware threads
tools         = ["inproc", "yd2rt"]   # the integrated program, then zeus_validation's yd2rt

[run.cfgs.default]            # default3 and default4 (imported) extend it
description = "Proton-PDF comparison at 27.5x920 GeV e+p against ZEUS 2012, in one process"
sweeps      = ["pdf"]

[tools.inproc]                # the integrated program (V21, V33)
tool           = "module"
executable     = "InprocJets.exe"
output_file    = "zeus.yoda"  # as the imported rivet table's, which yd2rt reads
pythia_cmnd    = true         # [tools.pythia]'s point card: sweeps and seeds included
rivet_analyses = true         # [tools.rivet]'s analyses (options included) and the plugin path

[tools.inproc.config]
engine        = "parallel"    # PythiaParallel as App_Pythia runs it; "serial": one Pythia8::Pythia
rivet_threads = 10            # Rivets on threads of their own, merged at the end (V34, L29)
