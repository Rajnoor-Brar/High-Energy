# InProcEIC.toml — eic.toml with Pythia and Rivet in one process (InprocJets, V33).
#
#   hep run PhotoProduction/InProcEIC                the configuration named in [run] (pdf)
#   hep run PhotoProduction/InProcEIC energy_pdf     another one
#   hep run PhotoProduction/InProcEIC radius --plan  look before running
#
# The physics is eic.toml's, imported (V94, V95): its statics, quantities, plots and the tools these
# configurations use (the pythia table's card photo_ep.cmnd, photo_eic, yd2rt, merge), so an edit
# there is an edit here. Only what differs is written below: the integrated program, the
# configurations that run it, and the run's own name. Instead of App_Pythia → FIFO → rivet, one
# program (modules/PhotoProduction/InprocJets.cc) runs PythiaParallel and its Rivets, and hands each
# event to Rivet as an in-memory HepMC3::GenEvent: no HepMC text, no FIFO (no [prelim] is imported).
# It gets the pythia table's point card (seeds included) and the rivet table's analyses with their
# options (radius's R) as standard configurations (04 §9.4); those two tables are configured, never
# run. Not here: eic's `delphes` chain (it needs the events outside the process) and its own `jets`
# table (this file's `inproc` is that program, with its Rivet threads).
#
# Seeds follow the generator's card, base card, binary, threads and event count (V22): with the same
# event_count and threads as an eic.toml configuration, a point here and the same point there are the
# same events.
#
# Speed: `rivet_threads` Rivets, each on its own thread, merged at the end (V34); they need the
# SISCone patch (L29, utils/Env/patches/), without which the program refuses more than one.
# Measured, 200k events of `single` with start-up: 12 + 1 Rivet 112 s, 12 + 12 Rivets 20.7 s,
# 10 + 14 19.3 s; eic.toml's chain with 12 + 10 shards 29.0 s.
#
# Physics notes (eic.toml's):
#   * Photon:ProcessType 0 and 1 give identical events with this card; the direct contribution needs
#     its own card (00/B13), so the `process` configuration is a null comparison.
#   * The base card's pTHatMin = 6 GeV sits above photo_eic's lowest jet ET bins, which biases them
#     (00/B27). The `pthatmin` configuration measures that.
#   * photo_eic's ETMIN/ETMIN2 defaults are 17/21 GeV in the source (its .info still says 5/10).

[config]
import = [{ from = "eic", only = ["static", "quantities", "plot",
                                  "tools.pythia", "tools.rivet", "tools.yd2rt", "tools.merge"] }]

[run]
serial        = 1
name          = "inproc_eic"
project       = "PhotoProduction"
configuration = "pdf"
event_count   = 1_000_000
threads       = 12            # Pythia's; as eic.toml, so the same seeds (10 + 14 Rivets is 7% faster)
tools         = ["inproc", "yd2rt"]   # every configuration's: the integrated program, then eic's yd2rt

[tools.inproc.config]
engine        = "parallel"    # PythiaParallel as App_Pythia runs it; "serial": one Pythia8::Pythia
rivet_threads = 12            # Rivets on threads of their own, merged at the end (V34, L29)

[run.cfgs.single]
description = "One run at the static point, in one process"
sweeps      = []

[run.cfgs.pdf]
serial      = 1
description = "Proton-PDF comparison at the static beams, in one process"
sweeps      = ["pdf"]

[run.cfgs.energies]
serial      = 2
description = "Beam-energy comparison at the static PDF, in one process"
sweeps      = ["energies"]

[run.cfgs.energy_pdf]
serial      = 3
description = "Beams x PDF grid: one page per energy, PDF curves on each, in one process"
sweeps      = ["energies", "pdf"]
plot_points = ["energies"]

[run.cfgs.mpi]
serial      = 4
description = "MPI pT0Ref scan at 18x275 with MPI on, in one process"
sweeps      = ["pt0ref"]
static      = { energies = "18x275" }

[run.cfgs.mpi_onoff]
serial      = 5
description = "MPI on vs off at 18x275, in one process"
sweeps      = ["mpi"]
static      = { energies = "18x275" }

[run.cfgs.mpi_grid]
serial      = 6
description = "pT0Ref x MPI grid: one page per MPI setting, pT0Ref curves on each, in one process"
sweeps      = ["pt0ref", "mpi"]
plot_points = ["mpi"]
static      = { energies = "18x275" }

[run.cfgs.pthatmin]
serial      = 7
description = "Generation-cut stability at the static beams (00/B27), in one process"
sweeps      = ["pthatmin"]

[run.cfgs.process]
serial      = 8
description = "Photon:ProcessType 0 vs 1 at 18x275: a null comparison with this card (00/B13), in one process"
sweeps      = ["process"]
static      = { energies = "18x275" }

[run.cfgs.radius]
serial      = 9
description = "Jet radius R at 18x275, in one process (the option reaches Rivet through rivet_analyses)"
sweeps      = ["radius"]
static      = { energies = "18x275" }

[run.cfgs.replicas]
serial      = 10
description = "Three seed replicas at the static point, merged after them by rivet-merge (post), in one process"
sweeps      = ["replica"]
tools       = ["inproc"]
post        = ["merge"]       # eic's merge: photo.yoda of every point → one YODA with their statistics

[tools.inproc]                # the integrated program (V21, V33)
tool           = "module"
executable     = "InprocJets.exe"
output_file    = "photo.yoda" # as the imported rivet table's, which yd2rt and merge read
pythia_cmnd    = true         # [tools.pythia]'s point card: sweeps and seeds included
rivet_analyses = true         # [tools.rivet]'s analyses (options included) and the plugin path

