# zeus_validation.toml — HERA validation of the photoproduction card against ZEUS 2012
# (rework v2 schema, docs/rework_v2/04_Config.md).
#
#   hep run PhotoProduction/zeus_validation          PDF comparison at HERA kinematics
#
# Translated from the v1 schema-2 file (git show rework/v1-final:configs/PhotoProduction/
# zeus_validation.toml). v1 fixed the beams in [beams] (ids [2212, 11], energies [920, 27.5]) and
# pinned the lepton to e+ through [static.use] beams = "ep"; here both are static quantities.

[run]
name          = "zeus"
project       = "PhotoProduction"
configuration = "default"
event_count   = 1_000_000
threads       = 20

[run.default]
description = "Proton-PDF comparison at 27.5x920 GeV e+p against ZEUS 2012 (built-in Rivet analysis)"
sweeps      = ["pdf"]
tools       = [["pythia", "rivet"]]

[run.single]
description = "One run at the static point"
sweeps      = []
tools       = [["pythia", "rivet"]]

[prelim]
fifo = ["events.hepmc"]

[static]
energies = "27x920"
lepton   = "ep"

[tools.pythia]
tool        = "pythia"
baseconfig  = "photo_ep.cmnd"
output_file = "events.hepmc"

[tools.rivet]
tool        = "rivet"
input       = "events.hepmc"
analyses    = ["ZEUS_2012_I1116258"]
output_file = "zeus.yoda"

[quantities.energies]
values = [[41, 5], [100, 10], [275, 18], [920, 27.5]]
tags   = ["5x41", "10x100", "18x275", "27x920"]
labels = ["5x41 GeV (#sqrt{s} = 28.6 GeV)", "10x100 GeV (#sqrt{s} = 63.2 GeV)",
          "18x275 GeV (#sqrt{s} = 140.7 GeV)", "27.5x920 GeV (#sqrt{s} = 318.1 GeV)"]

[quantities.lepton]
key    = { pythia = "Beams:idB" }
values = [11, -11]
tags   = ["em", "ep"]
labels = ["e^{-}", "e^{+}"]

[quantities.pdf]
values = ["MSTW2008lo68cl", "NNPDF23_lo_as_0130_qed", "NNPDF23_nlo_as_0119_qed", "PDF4LHC21_40"]
tags   = ["MSTW08lo", "NNPDF23lo", "NNPDF23nlo", "PDF4LHC21"]
labels = ["MSTW 2008 LO", "NNPDF 2.3 QCD+QED LO", "NNPDF 2.3 QCD+QED NLO", "PDF4LHC21"]

[plot]
void_empty  = true
min_entries = 10
auto_range  = true
# v1 drew Rivet's own ZEUS reference data (rivet_refs = true); in v2 that is a [plot.data] entry,
# written when the plot stage lands (P3).
