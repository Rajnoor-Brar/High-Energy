# zeus_seedSweep.toml — the ZEUS 2012 PDF comparison, each PDF run with several seeds and the seeds
# merged into one curve (combine, V35).
#
#   hep run PhotoProduction/zeus_seedSweep            4 PDFs × 5 seeds: pages with one curve per PDF,
#                                                    each the 5 seeds merged (5M events)
#   hep run PhotoProduction/zeus_seedSweep spread     the same 20 points, one page per PDF with a
#                                                    curve per seed: how far the seeds scatter
#
# The physics is zeus_validation.toml's at the paper's MPI setting (pT0Ref = 3.2 GeV, the 2025 study's
# zeus_pdf cards and Rathi & Palni's Figs. 1, 3–5). A seed is the `replica` quantity: it enters the
# generator's identity, so each value gets its own seed block and nothing else changes. The runner
# still gives out the seeds (V22), so the blocks never overlap, and `spread` gets the very same seeds
# as `default`, so the same events.
#
# `combine = ["replica"]`: the points that differ only in the replica are one group; after they
# finish, rivet-merge -e (seed replicas are one process: statistics add, σ is averaged) writes the
# group's zeus.yoda to results/…/<configuration>/<pdf>/, beside the replicas' own folders, and the
# pages are drawn from the groups. Five seeds of 1M are one sample of 5M: the curves' statistical
# errors shrink by √5 against one seed.
#
# The physics is zeus_validation.toml's, imported with what it imports from common.toml (V94): the
# beams and statics, the quantities (its PDFs, Pythia's own sets), the chain's tools and the plots
# with ZEUS's data map. Its own here: the configurations, the replicas, Rivet's 10 shards (a var over
# zeus_validation's 6, V96) and the backends and the data's legend.

[config]
import = [{ from = "zeus_validation", only = ["prelim", "static", "quantities", "tools", "plot"] }]

[config.vars]
shards = 10                               # one Rivet reads ~1,500 ev/s; 12 threads + 10 shards ~9,200 (L27)

[run]
serial        = 1
name          = "zeus_seeds"
project       = "PhotoProduction"
configuration = "default"
event_count   = 1_000_000                 # per seed, as the paper's per PDF
threads       = 12                        # Pythia's; with rivet's 10 shards it fills the 24 hardware threads
tools         = [["pythia", "rivet"]]

[run.cfgs.default]
description = "Proton-PDF comparison at 27.5x920 GeV e+p against ZEUS 2012: 5 seeds per PDF, merged"
sweeps      = ["pdf", "replica"]
combine     = ["replica"]

[run.cfgs.spread]
description = "The same points, one page per PDF with a curve per seed"
sweeps      = ["pdf", "replica"]
plot_points = ["pdf"]

[quantities.replica]
target = "pythia/seed"                    # enters the generator's identity, so its seed block; renders nothing
values = [1, 2, 3, 4, 5]                  # more seeds: more values (each is another 1M events per PDF)
tags   = ["s1", "s2", "s3", "s4", "s5"]
labels = ["seed 1", "seed 2", "seed 3", "seed 4", "seed 5"]

[plot]                                    # over zeus_validation's
backend = ["root", "yoda"]

[plot.data]
legend = "ZEUS 2012"
