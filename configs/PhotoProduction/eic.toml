[static]                     # v1's [static.use] and each quantity's `use`; lepton is common.toml's
energies = "18x275"
pdf      = "NNPDF23lo"
pt0ref   = "pt34"
mpi      = "mpi"

# ── its own tools (pythia, rivet and yd2rt are common.toml's) ───────────────────────────────────────

[tools.jets]                  # Pythia and Rivet in one process (InprocJets); InProcEIC.toml runs it
tool           = "module"
executable     = "InprocJets.exe"
output_file    = "photo.yoda"
pythia_cmnd    = true         # the point card App_Pythia would get, seeds included
rivet_analyses = true         # the rivet table's analyses and the plugin path

[tools.pythia_file]           # the same generator, writing a file for a tool that cannot stream
tool        = "pythia"
baseconfig  = "{var:card}"
output_file = "showered.hepmc"

[tools.delphes]
tool        = "delphes"
baseconfig  = "delphes_card_ATLAS.tcl"
input       = "showered.hepmc"
output_file = "delphes.root"

[tools.jets_reco]             # a custom analysis at detector level
tool        = "custom"
executable  = "path:python3"
arguments   = ["{repo}/modules/PhotoProduction/delphes_jets.py", "{input}", "{partial:output}"]
input       = "delphes.root"
output_file = "jets_reco.json"

[tools.merge]                 # post: photo.yoda of every point → one YODA with their statistics
tool        = "merge"
input       = "photo.yoda"
output_file = "merged.yoda"

# ── its own quantities (lepton, pdf, pt0ref and mpi are common.toml's) ──────────────────────────────

[quantities.energies]         # common.toml's beams, in this study's order and labels, 27x920 left out
values  = [[275, 18], [100, 10], [41, 5], [920, 27.5]]     # [E_p, E_e]: beam A is the proton
tags    = ["18x275", "10x100", "5x41", "27x920"]
labels  = ['$\sqrt{s}$ = 140.7 GeV', '$\sqrt{s}$ = 63.2 GeV', '$\sqrt{s}$ = 28.6 GeV',
           '$\sqrt{s}$ = 318.1 GeV']
exclude = [4]

[quantities.pthatmin]
key    = { pythia = "PhaseSpace:pTHatMin" }
values = [2.0, 3.0, 4.0, 6.0]
tags   = ["pth2", "pth3", "pth4", "pth6"]
labels = ['$\hat{p}_{T}$ > 2 GeV', '$\hat{p}_{T}$ > 3 GeV', '$\hat{p}_{T}$ > 4 GeV', '$\hat{p}_{T}$ > 6 GeV']

[quantities.process]
key    = { pythia = "Photon:ProcessType" }
values = [0, 1]
tags   = ["allproc", "resolved"]
labels = ["resolved + direct", "resolved"]

[quantities.radius]
target = "rivet/photo_eic"
key    = "R"
values = [0.4, 0.7, 1.0]
tags   = ["r04", "r07", "r10"]
labels = ["R = 0.4", "R = 0.7", "R = 1.0"]

[quantities.replica]
target = "pythia/seed"        # enters the generator's identity, so its seed block; renders nothing
values = [1, 2, 3]
tags   = ["s1", "s2", "s3"]
labels = ["seed 1", "seed 2", "seed 3"]

[quantities.etmin]
target = "rivet/photo_eic"
key    = "ETMIN"
values = [4.0, 5.0, 6.0]
tags   = ["et4", "et5", "et6"]
labels = ["$E_{T}$ > 4 GeV", "$E_{T}$ > 5 GeV", "$E_{T}$ > 6 GeV"]

# ── plot: common.toml's, with these over it ───────────────────────────────────────────────────────

[plot]
backend = ["root", "yoda", "mpl"]
formats = ["pdf", "png"]

[plot.style]
legend.position = "best"
ratio.range     = [0, 2.5]
ratio.limits    = [0, 2.5]
text.legend     = 9
text.header     = 8

[plot.figures.eta_algorithms]
class   = "overlay"
objects = ["d02-x01-y01", "d11-x01-y01", "d12-x01-y01"]
labels  = ["$k_{T}$", "anti-$k_{T}$", "SISCone"]
ratio   = true
style.ratio.range  = [0.8, 1.1]
style.ratio.limits = [0.8, 1.1]
