# eic.toml — the EIC photoproduction studies (rework v2 schema, docs/04_Config_Reference.md).
#
#   hep run PhotoProduction/eic                 the configuration named in [run] (pdf)
#   hep run PhotoProduction/eic energy_pdf      another one
#   hep run PhotoProduction/eic radius --plan   look before running
#
# Translated from the v1 schema-2 file (git show rework/v1-final:configs/PhotoProduction/eic.toml):
# each [study.<s>] is a [run.cfgs.<s>], `across` is `sweeps`, `overlay` became `plot_points`, a study's
# pin is its `static`, and v1's quantity types became per-tool keys (the master TOML knows how
# pythia consumes energies and pdf).
#
# Physics notes carried over from v1:
#   * Photon:ProcessType 0 and 1 give identical events with this card; the direct contribution needs
#     its own card (00/B13), so the `process` configuration is a null comparison.
#   * The base card's pTHatMin = 6 GeV sits above photo_eic's lowest jet ET bins, which biases them
#     (00/B27). The `pthatmin` configuration measures that.
#   * photo_eic's ETMIN/ETMIN2 defaults are 17/21 GeV in the source (its .info still says 5/10).
#
# The chain, the quantities it shares with zeus_validation.toml and the common plot keys are
# common.toml's (imported, V94); this file says its card, analysis and shards, and what is its
# own: the configurations, the statics, its energies (in its order, 27x920 left out), the quantities
# only these studies sweep, the Delphes and in-process tools, and its backends, style and figure.

[config]
import = ["common"]

[config.vars]
card     = "photo_ep.cmnd"
analysis = "photo_eic"
product  = "photo"
shards   = 10

[run]
name          = "eic"
serial        = 2
project       = "PhotoProduction"
configuration = "single"
# sweep_runs    = ["ener0", "ener1", "ener2", "ener3"]
threads       = 12            # Pythia's; with rivet's 10 shards that fills the 24 hardware threads
tools         = [["pythia", "rivet"], "yd2rt"]   # every configuration's chain, unless it sets its own (V99)

# [run.cfgs.single]
# description = "One run at the static point (27x920 e+p)"
# sweeps      = []

# [run.cfgs.pdf]
# serial      = 1
# description = "Proton-PDF comparison at the static beams"
# sweeps      = ["pdf"]

[run.cfgs.ener0]
label       = "Energies_01M"
event_count = 1_000_000
description = "Beam-energy comparison at the static PDF"
sweeps      = ["energies"]

# The same comparison at more events: each is `ener0` with its own folder and event count.
[run.cfgs.ener1]
extends     = "ener0"
label       = "Energies_10M"
event_count = 10_000_000

[run.cfgs.ener2]
extends     = "ener0"
label       = "Energies_100M"
event_count = 100_000_000

[run.cfgs.ener3]
extends     = "ener0"
label       = "Energies_50M"
event_count = 50_000_000

[run.cfgs.single]
event_count = 25_000_000
description = "One run at the static point"
sweeps      = []

