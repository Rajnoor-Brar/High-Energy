# ── Paint ────────────────────────────────────────────────────────────────────
# Paint::loadBook reads [paint] then named result tables.
# [paint.default.*] provides fallback style for all results.

[paint]
root_file  = "output/Lambda_Reconstruction/_08/Lambda_Recons_7000GeV_10M.root"
result_dir = "results/"
results    = ["Mass_Invariant", "Energy_Net", "Momentum"]

# --- [paint.<ResultName>] (example — one table per result) -------------------

[paint.Mass_Invariant]
sources_objects = ["Mass_Invariant"]
source_types    = ["H1"]          # H1 | H2 | Graph

[paint.Mass_Invariant.style]
line_color = "kRed-4"
fill_color = "kRed-7"

# --- [paint.default.*] — fallback style applied to all results ---------------

[paint.default.style]
line_color   = "kBlue-6"
line_width   = 2
line_style   = 1
fill_color   = "kBlue-7"
fill_style   = 3003
marker_color = "kBlack"
marker_style = 20
marker_size  = 1.0
draw_option  = "HIST"
minimum      = 0.0

[paint.default.axis]
title_font    = 43
label_font    = 43
title_size    = 27.0
label_size    = 20.0
offset_x      = 1.1
offset_y      = 1.35
center_titles = true
max_digits_y  = 3
title_x       = ""
title_y       = ""

[paint.default.canvas]
width    = 900
height   = 600
margin_l = 0.12
margin_r = 0.05
margin_b = 0.12
margin_t = 0.08
ticks_x  = true
ticks_y  = true

[paint.default.stats]
show        = true
opt_stat    = "emr"
x           = 0.92
y           = 0.89
width       = 0.18
height      = 0.10
text_font   = 43
text_size   = 12.0
border_size = 2

[paint.default.legend]
show      = false
x1        = 0.65
y1        = 0.75
x2        = 0.88
y2        = 0.88
text_font = 43
text_size = 14.0
