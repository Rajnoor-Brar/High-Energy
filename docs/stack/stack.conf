# docs/stack/stack.conf — settings for build_stack.sh, every one with its default (a bash file, sourced):
#
#   bash docs/stack/build_stack.sh --config docs/stack/stack.conf
#
# Copy it, uncomment what you change. A VAR=value on the command line still wins over this file.

# ── where and what ─────────────────────────────────────────────────────────────────────────────
# HEP_PREFIX=$HOME/HEP              # src/ build/ install/ .venv/ logs/ setup.sh
# PACKAGES=core                     # core | all | a list, e.g. "venv lhapdf hepmc3 fastjet rivet"
# FORCE=""                          # rebuild these although they are stamped as built
# DRY_RUN=0                         # 1: print every command, run nothing

# ── the machine ────────────────────────────────────────────────────────────────────────────────
# JOBS=$(nproc)                     # make/cmake jobs for every package but ROOT
# ROOT_JOBS=auto                    # auto = RAM ÷ 3 GB (LLVM/Cling OOM-kills at more); or a number
# SYSTEM_DEPS=auto                  # auto | apt | dnf | skip
# SUDO=auto                         # auto: sudo when not root; "" to run apt/dnf as you are
# PYTHON=python3                    # the interpreter the venv is made from (3.10 or newer)
# KEEP_BUILD=1                      # 0: remove each cmake build tree once installed (saves ~15 GB)

# ── the compiler ───────────────────────────────────────────────────────────────────────────────
# CXX_STD=17                        # one standard for the whole stack: ROOT, Rivet and Pythia share ABIs
# OPT_FLAGS=-O2

# ── versions (the lab PC's) ────────────────────────────────────────────────────────────────────
# LHAPDF_VERSION=6.5.6
# HEPMC3_VERSION=3.3.1
# FASTJET_VERSION=3.5.0             # the SISCone patch is made for 3.5.0's SISCone
# FJCONTRIB_VERSION=1.104
# ROOT_VERSION=6.40.04              # never 6.40.00 (rootcling regression)
# YODA_VERSION=2.1.3
# RIVET_VERSION=4.1.3
# PYTHIA8_VERSION=8317
# THEPEG_VERSION=2.3.0
# HERWIG_VERSION=7.3.0
# DELPHES_VERSION=3.5.1
# SHERPA_VERSION=3.0.5
# MADGRAPH_VERSION=3.7.3
# WHIZARD_VERSION=3.1.8
# ONNXRUNTIME_VERSION=1.29.0
# GEANT4_VERSION=11.4.2
# XROOTD_VERSION=6.1.1              # only with PACKAGES naming xrootd: ROOT builds its own

# ── features ───────────────────────────────────────────────────────────────────────────────────
# FASTJET_SISCONE_PATCH=1           # thread-local SISCone (L29): needed for InprocJets' several Rivets
# FASTJET_PATCH=<repo>/utils/Env/patches/fastjet-3.5.0-siscone-thread-local-ranlux.patch
# ROOT_GRAPHICS=ON                  # x11 opengl webgui asimage; OFF for a headless container
# ROOT_EXTRA=""                     # more ROOT cmake arguments, e.g. "-Droofit=OFF"
# GEANT4_DATA=ON                    # the physics datasets (~4 GB, downloaded during the build)
# GEANT4_X11=ON
# GEANT4_MT=ON
# SHERPA_EXTRA=""                   # more Sherpa cmake arguments
# PDF_SETS="CT14lo CT14nlo …"       # the LHAPDF sets `pdfsets` installs (the lab PC's; see the script)
# PYTHON_PACKAGES="numpy cython tomli_w rich pyyaml pillow matplotlib uproot awkward pytest"
# PYTHON_EXTRAS="vector hist mplhep particle hepunits scipy pandas scikit-learn xgboost lightgbm pyhf onnx"

# ── the environment script ─────────────────────────────────────────────────────────────────────
# SETUP_STYLE=auto                  # repo: a stub sourcing High-Energy's utils/Env/hep_env.sh
#                                   # standalone: paths, venv and data variables only
#                                   # auto: repo when the script sits in a High-Energy checkout
# HEKIT_ROOT=""                     # the checkout, for SETUP_STYLE=repo (default: this one)

# ── downloads (a tarball already in $HEP_PREFIX/src is used offline) ───────────────────────────
# ROOT_URL=https://root.cern/download/root_v${ROOT_VERSION}.source.tar.gz
# MADGRAPH_URL=…                    # Launchpad renames releases often: set it when the default 404s
# ONNXRUNTIME_URL=…                 # default: the GitHub release for this machine's architecture
# (every package has a <NAME>_URL; see the top of build_stack.sh)
